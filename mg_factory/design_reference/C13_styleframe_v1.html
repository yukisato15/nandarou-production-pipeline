<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>C13 スタイルフレーム v1 — 『なんだろう』解体</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700;800&family=Oswald:wght@400;500&family=Zen+Kurenaido&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E0F10; --ink2:#17181A;
    --paper:#E3DED1; --paper2:#EFEAE0; --paper-dark:#D6CFBE;
    --gold:#C9A063; --gold-deep:#A9814A;
    --red:#B8352E;
    --ash:#6E6D66; --white:#EAE6DF;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#1a1a1c;font-family:'Shippori Mincho',serif;overflow-x:hidden;padding-bottom:40px}
  .bar{display:flex;gap:10px;align-items:center;padding:14px 24px;color:#999;font-size:13px;font-family:sans-serif}
  .bar button{font-family:sans-serif;font-size:13px;padding:6px 16px;background:#2a2a2e;color:#bbb;border:1px solid #444;border-radius:4px;cursor:pointer}
  .bar button.on{background:var(--gold);color:#111;border-color:var(--gold)}
  .stage{display:flex;justify-content:center}
  .frame-outer{position:relative}
  .frame{position:relative;width:1920px;height:1080px;background:var(--paper);overflow:hidden;transform-origin:top left}

  /* ---------- 紙の質感 ---------- */
  .grain,.vig,.stain{position:absolute;inset:0;pointer-events:none}
  .grain{opacity:.55;mix-blend-mode:multiply}
  .vig{background:radial-gradient(ellipse 75% 68% at 50% 46%, transparent 55%, rgba(30,25,15,.28) 100%)}
  .stain{background:
    radial-gradient(ellipse 300px 200px at 12% 88%, rgba(120,100,60,.10), transparent 70%),
    radial-gradient(ellipse 400px 260px at 88% 10%, rgba(120,100,60,.08), transparent 70%),
    radial-gradient(ellipse 500px 300px at 50% 50%, rgba(255,252,240,.20), transparent 75%)}

  /* ---------- 共通部品 ---------- */
  .node-label{position:absolute;font-weight:700;font-size:40px;letter-spacing:.18em;color:var(--ink);text-align:center;width:300px}
  .node-label small{display:block;font-family:'Oswald';font-weight:400;font-size:15px;letter-spacing:.35em;color:var(--ash);margin-top:6px}
  .hand{position:absolute;font-family:'Zen Kurenaido';color:#3a3a38;font-size:27px;letter-spacing:.06em}
  .stamp{position:absolute;width:44px;height:44px;border:2.5px solid var(--red);border-radius:50%;color:var(--red);
    font-family:'Shippori Mincho';font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center;
    transform:rotate(-6deg);opacity:.85}

  /* 目の写真(AI画像プレースホルダ) */
  .photo{position:absolute;width:340px;height:250px;background:#141416;box-shadow:0 14px 30px rgba(20,15,5,.35);
    transform:rotate(-2.2deg);padding:10px}
  .photo .img{width:100%;height:100%;background:radial-gradient(ellipse 60% 50% at 50% 52%, #2e3134 0%, #17181a 70%);
    position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .tape{position:absolute;width:110px;height:34px;background:rgba(226,218,195,.75);box-shadow:0 2px 5px rgba(0,0,0,.18)}
  .ph-note{position:absolute;bottom:8px;right:10px;font-family:sans-serif;font-size:12px;color:#777;letter-spacing:.1em}

  /* 再生カウンター(UI風カード) */
  .counter{position:absolute;width:360px;height:150px;background:var(--ink2);border-radius:10px;transform:rotate(1.2deg);
    box-shadow:0 14px 30px rgba(20,15,5,.35);display:flex;align-items:center;gap:22px;padding:0 30px;border:1px solid #2c2d30}
  .counter .play{width:0;height:0;border-left:30px solid var(--white);border-top:19px solid transparent;border-bottom:19px solid transparent;opacity:.9}
  .counter .num{font-family:'Oswald';font-weight:500;font-size:54px;color:var(--white);letter-spacing:.04em;line-height:1}
  .counter .num small{display:block;font-size:16px;font-weight:400;color:#8b8b85;letter-spacing:.3em;margin-top:6px}
  .pin{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--red);box-shadow:0 3px 5px rgba(0,0,0,.35), inset -2px -3px 4px rgba(0,0,0,.3)}

  /* ¥ 紙片 */
  .scrap{position:absolute;width:330px;height:230px;background:var(--paper2);transform:rotate(2deg);
    box-shadow:0 14px 28px rgba(20,15,5,.3);
    clip-path:polygon(2% 3%,97% 0%,100% 96%,55% 100%,3% 98%,0% 45%);
    display:flex;flex-direction:column;align-items:center;justify-content:center}
  .scrap .yen{font-weight:800;font-size:110px;color:var(--gold-deep);line-height:1;
    text-shadow:0 0 1px rgba(169,129,74,.5)}
  .scrap .sub{font-family:'Zen Kurenaido';font-size:22px;color:#4a4a45;margin-top:10px}

  /* S2 ★テロップ */
  .statement{position:absolute;left:0;right:0;text-align:center;font-weight:700;color:var(--ink);letter-spacing:.12em}
  .statement .em{color:var(--gold-deep)}
  .statement .st-note{display:block;font-family:sans-serif;font-weight:400;font-size:12px;color:#8a887e;letter-spacing:.2em;margin-top:14px}

  .blur-edge{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 62% 58% at 44% 46%, transparent 55%, rgba(227,222,209,.0) 60%);
    backdrop-filter:none}
</style>
</head>
<body>

<div class="bar">
  <span>C13 スタイルフレーム v1 &nbsp;/&nbsp; 1920×1080 &nbsp;|&nbsp;</span>
  <button id="btnA" class="on" onclick="show('A')">案A 引き(★決め画・カット終盤)</button>
  <button id="btnB" onclick="show('B')">案B 寄り(ドリー途中・カット中盤)</button>
  <span id="desc"></span>
</div>

<div class="stage"><div class="frame-outer">

<!-- ============ 案A:引き(決め画) ============ -->
<div class="frame" id="frameA">
  <svg width="0" height="0" style="position:absolute">
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.015 0.09" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.03 0.12" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5"/></filter>
  </svg>

  <div class="stain"></div>

  <!-- 金茶の手引き線(1本のフロー) -->
  <svg width="1920" height="1080" style="position:absolute;inset:0">
    <g filter="url(#rough)" fill="none" stroke="var(--gold-deep)" stroke-width="4.5" stroke-linecap="round" opacity=".9">
      <path d="M 505 430 C 610 415, 680 460, 770 452"/>
      <path d="M 1155 445 C 1250 435, 1310 470, 1395 455"/>
      <!-- 矢先 -->
      <path d="M 748 436 L 772 452 L 744 466"/>
      <path d="M 1373 439 L 1397 455 L 1369 469"/>
    </g>
    <!-- 下線:注意=商品 の勘定線 -->
    <g filter="url(#rough2)" fill="none" stroke="#3a3a36" stroke-width="2" opacity=".55">
      <path d="M 300 760 L 1620 760"/>
    </g>
  </svg>

  <!-- ① 視線 -->
  <div class="photo" style="left:220px;top:280px">
    <div class="img">
      <!-- AI画像プレースホルダ:瞳に画面の反射 -->
      <svg width="260" height="150" viewBox="0 0 260 150">
        <ellipse cx="130" cy="75" rx="110" ry="52" fill="none" stroke="#c9c4b4" stroke-width="2" opacity=".8"/>
        <circle cx="130" cy="75" r="34" fill="#0d0e10" stroke="#c9a063" stroke-width="1.5" opacity=".95"/>
        <circle cx="130" cy="75" r="14" fill="#000"/>
        <rect x="120" y="63" width="22" height="13" rx="2" fill="#dfe6ef" opacity=".85"/>
      </svg>
      <div class="ph-note">AI画像に差し替え(目元のみ・低彩度)</div>
    </div>
    <div class="tape" style="left:-28px;top:-14px;transform:rotate(-38deg)"></div>
    <div class="tape" style="right:-30px;top:-12px;transform:rotate(34deg)"></div>
  </div>
  <div class="stamp" style="left:200px;top:250px">一</div>
  <div class="node-label" style="left:240px;top:566px">視線<small>GAZE</small></div>
  <div class="hand" style="left:205px;top:660px;transform:rotate(-2deg)">つい、見てしまう。</div>

  <!-- ② 再生 -->
  <div class="counter" style="left:790px;top:340px">
    <div class="play"></div>
    <div class="num">1,024,553<small>回再生</small></div>
  </div>
  <div class="pin" style="left:962px;top:330px"></div>
  <div class="stamp" style="left:780px;top:288px">二</div>
  <div class="node-label" style="left:820px;top:566px">再生<small>PLAY COUNT</small></div>

  <!-- ③ 広告費 -->
  <div class="scrap" style="left:1400px;top:300px">
    <div class="yen">¥</div>
    <div class="sub">1再生 ≈ 0.1〜0.5円</div>
  </div>
  <div class="stamp" style="left:1382px;top:262px">三</div>
  <div class="node-label" style="left:1415px;top:566px">広告費<small>AD REVENUE</small></div>

  <!-- ★ S2テロップ(下1/3・幹) -->
  <div class="statement" style="top:812px;font-size:64px">
    売られているのは、あなたの<span class="em">『注意』</span>です。
    <span class="st-note">S2規定:貂明朝Bold(代替 しっぽり明朝)/強調1語のみ金茶 #C9A063</span>
  </div>

  <div class="vig"></div>
  <svg class="grain" width="1920" height="1080"><filter id="gA"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11"/><feColorMatrix type="matrix" values="0 0 0 0 0.42, 0 0 0 0 0.40, 0 0 0 0 0.34, 0 0 0 0.09 0"/></filter><rect width="1920" height="1080" filter="url(#gA)"/></svg>
</div>

<!-- ============ 案B:寄り(ドリー途中) ============ -->
<div class="frame" id="frameB" style="display:none">
  <div class="stain"></div>
  <!-- 同じボードを1.7倍・視線〜再生にフレーミング。線は描画途中 -->
  <div style="position:absolute;inset:0;transform:scale(1.7) translate(-105px,-115px);transform-origin:0 0">
    <svg width="1920" height="1080" style="position:absolute;inset:0">
      <g filter="url(#roughB)" fill="none" stroke="var(--gold-deep)" stroke-width="4.5" stroke-linecap="round" opacity=".9">
        <path d="M 505 430 C 610 415, 660 455, 715 452"/>
      </g>
      <filter id="roughB"><feTurbulence type="fractalNoise" baseFrequency="0.015 0.09" numOctaves="2" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="7"/></filter>
    </svg>
    <div class="photo" style="left:220px;top:280px">
      <div class="img">
        <svg width="260" height="150" viewBox="0 0 260 150">
          <ellipse cx="130" cy="75" rx="110" ry="52" fill="none" stroke="#c9c4b4" stroke-width="2" opacity=".8"/>
          <circle cx="130" cy="75" r="34" fill="#0d0e10" stroke="#c9a063" stroke-width="1.5" opacity=".95"/>
          <circle cx="130" cy="75" r="14" fill="#000"/>
          <rect x="120" y="63" width="22" height="13" rx="2" fill="#dfe6ef" opacity=".85"/>
        </svg>
        <div class="ph-note">AI画像に差し替え</div>
      </div>
      <div class="tape" style="left:-28px;top:-14px;transform:rotate(-38deg)"></div>
      <div class="tape" style="right:-30px;top:-12px;transform:rotate(34deg)"></div>
    </div>
    <div class="stamp" style="left:200px;top:250px">一</div>
    <div class="node-label" style="left:240px;top:566px">視線<small>GAZE</small></div>
    <div class="hand" style="left:205px;top:660px;transform:rotate(-2deg)">つい、見てしまう。</div>
    <div class="counter" style="left:790px;top:340px;filter:blur(1.5px);opacity:.92">
      <div class="play"></div>
      <div class="num">1,024,553<small>回再生</small></div>
    </div>
    <div class="pin" style="left:962px;top:330px;filter:blur(1.5px)"></div>
  </div>
  <div class="vig" style="background:radial-gradient(ellipse 70% 62% at 38% 46%, transparent 45%, rgba(30,25,15,.34) 100%)"></div>
  <svg class="grain" width="1920" height="1080"><filter id="gB"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="12"/><feColorMatrix type="matrix" values="0 0 0 0 0.42, 0 0 0 0 0.40, 0 0 0 0 0.34, 0 0 0 0.09 0"/></filter><rect width="1920" height="1080" filter="url(#gB)"/></svg>
</div>

</div></div>

<script>
  const descs={
    A:"— 金茶線が描き終わり、★テロップが立つ瞬間(1:41頃)。この1枚が承認基準。",
    B:"— カメラが線を追ってドリー中(1:34頃)。奥は浅い被写界深度で溶かす。"
  };
  function show(v){
    frameA.style.display=v==='A'?'block':'none';
    frameB.style.display=v==='B'?'block':'none';
    btnA.classList.toggle('on',v==='A');
    btnB.classList.toggle('on',v==='B');
    desc.textContent=descs[v];
  }
  function fit(){
    const w=Math.min(window.innerWidth-40,1920), s=w/1920;
    document.querySelectorAll('.frame').forEach(f=>{f.style.transform=`scale(${s})`});
    document.querySelector('.frame-outer').style.width=(1920*s)+'px';
    document.querySelector('.frame-outer').style.height=(1080*s)+'px';
  }
  window.addEventListener('resize',fit); fit(); show('A');
</script>
</body>
</html>
