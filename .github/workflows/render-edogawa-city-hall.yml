name: Render Edogawa City Hall

on:
  workflow_dispatch:
  push:
    branches:
      - feature/edogawa-city-hall-v01
    paths:
      - 'remotion_mg/data/edogawa_city_hall_v01.json'
      - 'remotion_mg/src/edogawa-entry.tsx'
      - 'remotion_mg/src/compositions/**'
      - 'remotion_mg/src/kit/**'
      - '.github/workflows/render-edogawa-city-hall.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: remotion_mg/package-lock.json

      - name: Install dependencies
        working-directory: remotion_mg
        run: npm ci

      - name: Typecheck
        working-directory: remotion_mg
        run: npm run typecheck

      - name: Render MP4
        working-directory: remotion_mg
        run: |
          mkdir -p out
          npx remotion render src/edogawa-entry.tsx EdogawaCityHall out/edogawa-city-hall-v01.mp4 \
            --codec=h264 \
            --crf=18 \
            --concurrency=2

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: edogawa-city-hall-v01
          path: remotion_mg/out/edogawa-city-hall-v01.mp4
          if-no-files-found: error
          retention-days: 14
